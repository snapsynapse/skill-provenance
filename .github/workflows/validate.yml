name: Validate bundle

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# The job named `validate` is a required status check in the `main` branch
# ruleset. Do not rename it or turn it into a matrix: either changes the
# check name and blocks every pull request. Add further coverage as separate
# jobs, as below.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify repository search contract
        run: node scripts/check-search.mjs

      - name: Verify bundle hashes
        uses: ./
        with:
          bundle-path: skill-provenance

      - name: Test strict package build
        run: |
          chmod +x skill-provenance/package.sh
          ./skill-provenance/package.sh strict /tmp/build/strict
          echo "Strict build OK"

      - name: Test clawhub package build
        run: |
          ./skill-provenance/package.sh clawhub /tmp/build/clawhub
          echo "ClawHub build OK"

      - name: Verify release surfaces
        run: ./.github/scripts/release-surface-check.sh

      - name: Verify action input transport
        run: ./.github/scripts/action-security-check.sh

      - name: Test validator hash states
        run: ./.github/scripts/test-validate.sh

      - name: Test standalone verifier pinning
        run: ./.github/scripts/test-standalone-verify.sh

  # macOS ships Bash 3.2 and BSD userland. Run the same regression suites
  # there so the scripts stay portable to the shell most local users have.
  validate-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Show system Bash version
        run: /bin/bash --version

      - name: Verify bundle hashes
        run: /bin/bash skill-provenance/validate.sh --strict -- skill-provenance

      - name: Test validator hash states
        run: /bin/bash .github/scripts/test-validate.sh

      - name: Test standalone verifier pinning
        run: /bin/bash .github/scripts/test-standalone-verify.sh

      - name: Verify action input transport
        run: /bin/bash .github/scripts/action-security-check.sh

      - name: Verify release surfaces
        run: /bin/bash .github/scripts/release-surface-check.sh

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint shell scripts
        run: |
          shellcheck --version
          shellcheck --severity=warning \
            verify.sh \
            action-validate.sh \
            skill-provenance/validate.sh \
            skill-provenance/package.sh \
            .github/scripts/*.sh \
            scripts/adversarial-agent-evals.sh
