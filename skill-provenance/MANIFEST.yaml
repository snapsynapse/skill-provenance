    notes: >
      Canonical hashes, focused skill metadata, OpenAI metadata, Codex plugin
      package, repository search contract, derived archive, regression suite,
      and GitHub publication dry-run passed. Attestation remains informational.
  - bundle_version: 6.2.0
    harness: OpenAI Codex desktop
    model: GPT-5
    date: 2026-08-28
    result: pass
    method: validate.sh verify + regression suite + standalone pin test + derived package validation + search contract + gh skill publish dry-run + release-surface-check.sh
    notes: >
      Canonical hashes, local and downloaded standalone verifier pinning,
      tamper rejection, exit-code preservation, temporary cleanup, derived
      strict and ClawHub packages, repository search contract, archive
      agreement, and release surfaces passed. Attestation remains informational.
  - bundle_version: 6.3.0
    harness: OpenAI Codex desktop
    model: GPT-5
    date: 2026-09-05
    result: pass
    method: validate.sh verify + regression suite + skill validation + CFF schema validation + search contract + release-surface-check.sh
    notes: >
      Canonical hashes, verified-adoption classification, release-artifact
      subjects, citation truthfulness, Scorecard evidence discipline, exact
