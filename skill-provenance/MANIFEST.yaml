  - bundle_version: 6.3.0
    harness: OpenAI Codex desktop
    model: GPT-5
    date: 2026-09-05
    result: pass
    method: validate.sh verify + regression suite + skill validation + CFF schema validation + search contract + release-surface-check.sh
    notes: >
      Canonical hashes, verified-adoption classification, release-artifact
